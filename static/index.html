<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMR Scanner</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1b1b1b;--mu:#6b6b6b;--ac:#c62828;--ok:#2e7d32;--bd:#e2dfd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#232323;--tx:#eee;--mu:#9a9a9a;--bd:#3a3a3a;--ac:#ef5350;--ok:#66bb6a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}h1{font-size:21px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 10px}.s{color:var(--mu);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-block}
button.p,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.key{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.kr{display:flex;align-items:center;gap:5px}.kr b{width:24px;text-align:right;font-size:12px;color:var(--mu)}
.kr button{padding:4px 0;width:34px;border-radius:50%;font-size:13px}.kr button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=text]{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0;flex:1}
input.bad{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
video{width:100%;border-radius:10px;background:#000;margin-top:8px}
.res{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}.res.err{border-color:var(--ac)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.score{font-size:24px;font-weight:700}
.st{font-size:13px;color:var(--mu)}.st b{color:var(--tx)}.res img{width:100%;border-radius:8px;margin-top:8px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.warn{color:var(--ac);font-size:13px;margin:6px 0 0}
</style></head><body><main>
<h1>OMR Scanner</h1><p class="s">Key set koro → photo / PDF / camera diye scan koro → Excel export koro</p>

<section class="card"><h2>১. Exam setup</h2>
<input type="text" id="exam" placeholder="Exam-er naam (Excel file-er naam hobe)">
<p class="s" style="margin-top:10px">Koyta MCQ?</p><div class="row seg" id="nsel"></div>
<p class="s" style="margin-top:12px">Prottek question-er sothik uttor select koro</p><div class="key" id="key"></div></section>

<section class="card"><h2>২. Scan</h2>
<div class="row"><label class="btn p">📁 Photo / PDF (ekshathe onek-gulo)<input type="file" id="files" accept="image/*,application/pdf" multiple hidden></label>
<button id="bcam">📷 Live camera</button></div>
<div id="camwrap" hidden><video id="vid" playsinline muted></video><div class="row" style="margin-top:8px"><button class="p" id="bsnap">Capture ar scan</button><button id="bstop">Camera bondho</button></div>
<p class="s">Pura sheet frame-e rekhe, alo bhalo rekhe, sidha kore capture koro.</p></div>
<div class="bar" id="bar" hidden><i id="barin"></i></div><p class="s" id="status"></p></section>

<section class="card" id="resc" hidden><h2>৩. Results <span class="s" id="sum"></span></h2>
<div class="row"><button class="p" id="bexp">⬇ Excel export (.xlsx)</button><button id="bclr">Shob muche felo</button></div><div id="list"></div></section>

<script>
const L=['ক','খ','গ','ঘ'];let N=50,key=[],results=[],stream=null,cam=0,uid=0;
const $=i=>document.getElementById(i);
try{const s=JSON.parse(localStorage.getItem('omr')||'null');if(s){N=s.N;key=s.key;$('exam').value=s.exam||''}}catch(e){}
const save=()=>{try{localStorage.setItem('omr',JSON.stringify({N,key,exam:$('exam').value}))}catch(e){}};
$('exam').oninput=save;
function drawSetup(){const ns=$('nsel');ns.innerHTML='';[25,30,50].forEach(n=>{const b=document.createElement('button');b.textContent=n;if(n==N)b.className='on';b.onclick=()=>{N=n;save();drawSetup();renderList()};ns.append(b)});
 const k=$('key');k.innerHTML='';for(let q=0;q<N;q++){const r=document.createElement('div');r.className='kr';r.innerHTML='<b>'+(q+1)+'</b>';
  L.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;if(key[q]===i)b.className='on';b.onclick=()=>{key[q]=i;save();drawSetup();renderList()};r.append(b)});k.append(r)}}
const keyOK=()=>{for(let q=0;q<N;q++)if(!(key[q]>=0))return false;return true};
function score(r){let c=0,w=0,b=0,d=0;const st=[];for(let q=0;q<N;q++){const a=r.answers[q];if(a==='-'){b++;st.push('b')}else if(a==='*'){d++;st.push('d')}else if(L.indexOf(a)===key[q]){c++;st.push('c')}else{w++;st.push('w')}}Object.assign(r,{correct:c,wrong:w,blank:b,double:d,status:st})}

async function scanFile(file){const fd=new FormData();fd.append('file',file,file.name);fd.append('n',N);fd.append('key',JSON.stringify(key.slice(0,N)));
 try{const r=await fetch('/api/scan',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Server error');return j.results}
 catch(e){return[{file:file.name,error:e.message||'Network somossa'}]}}
async function run(files){if(!keyOK()){alert('Age ১ নম্বর ধাপে '+N+' ta question-er shob uttor set koro.');return}
 $('bar').hidden=false;let i=0;for(const f of files){$('status').textContent='Scan hocche '+(i+1)+' / '+files.length+' : '+f.name;$('barin').style.width=(100*i/files.length)+'%';
  const rs=await scanFile(f);rs.forEach(r=>{r.id=++uid;if(!r.error){score(r)}results.push(r)});renderList();i++}
 $('barin').style.width='100%';$('status').textContent=files.length+' ta file scan hoyeche.';setTimeout(()=>$('bar').hidden=true,800)}
$('files').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await run(f)};

$('bcam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:2560},height:{ideal:1440}}});$('vid').srcObject=stream;$('camwrap').hidden=false;await $('vid').play()}catch(e){alert('Camera chalu hocche na (permission/browser). "Photo / PDF" button diye photo upload koro.')}};
const stopCam=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camwrap').hidden=true};$('bstop').onclick=stopCam;
$('bsnap').onclick=()=>{const v=$('vid'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
 c.toBlob(b=>run([new File([b],'camera-'+(++cam)+'.jpg',{type:'image/jpeg'})]),'image/jpeg',.92)};

function renderList(){const el=$('list');el.innerHTML='';$('resc').hidden=!results.length;
 let tot=0,cnt=0;
 results.forEach(r=>{const d=document.createElement('div');d.className='res'+(r.error?' err':'');
  if(r.error){d.innerHTML='<div class="top"><b></b><button>✕</button></div><p class="warn"></p>';d.querySelector('b').textContent=r.file;d.querySelector('p').textContent='⚠ '+r.error;d.querySelector('button').onclick=()=>{results=results.filter(x=>x!==r);renderList()};el.append(d);return}
  score(r);tot+=r.correct;cnt++;
  d.innerHTML='<div class="top"><div class="row" style="flex:1"><input type="text" class="roll" placeholder="Roll" style="max-width:110px"><input type="text" class="nm" placeholder="Student naam"></div><div class="score"></div></div><div class="st"></div><div class="row" style="margin-top:8px"><button class="tg">Overlay dekho</button><button class="rm">Muche felo</button></div><p class="warn" hidden></p>';
  const roll=d.querySelector('.roll'),nm=d.querySelector('.nm');roll.value=r.roll||'';nm.value=r.name||'';
  const chk=()=>roll.classList.toggle('bad',/[?*]/.test(roll.value));chk();
  roll.oninput=()=>{r.roll=roll.value;chk()};nm.oninput=()=>{r.name=nm.value};
  d.querySelector('.score').textContent=r.correct+' / '+N;
  d.querySelector('.st').innerHTML='<b>'+r.file.replace(/[<>&]/g,'')+'</b> · Correct <b>'+r.correct+'</b> · Wrong <b>'+r.wrong+'</b> · Blank <b>'+r.blank+'</b> · Double <b>'+r.double+'</b>';
  if(/[?*]/.test(r.roll||''))Object.assign(d.querySelector('.warn'),{hidden:false,textContent:'Roll number puro read hoyni (? = bubble nai, * = ekadhik). Haate thik koro.'});
  let img=null;d.querySelector('.tg').onclick=()=>{if(img){img.remove();img=null;return}img=new Image();img.src=r.overlay;d.append(img)};
  d.querySelector('.rm').onclick=()=>{results=results.filter(x=>x!==r);renderList()};el.append(d)});
 $('sum').textContent=cnt?'· '+cnt+' sheet · gor '+(tot/cnt).toFixed(1)+' / '+N:''}

$('bclr').onclick=()=>{if(confirm('Shob result muche felbo?')){results=[];renderList()}};
$('bexp').onclick=async()=>{const rows=results.filter(r=>!r.error).map(r=>({roll:r.roll||'',name:r.name||'',correct:r.correct,wrong:r.wrong,blank:r.blank,double:r.double,answers:r.answers,status:r.status}));
 if(!rows.length)return;const res=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam:$('exam').value,n:N,key:key.slice(0,N),rows})});
 if(!res.ok){alert('Export hoyni');return}const a=document.createElement('a');a.href=URL.createObjectURL(await res.blob());a.download=($('exam').value.trim()||'omr-results')+'.xlsx';a.click()};
drawSetup();
</script></main></body></html>
