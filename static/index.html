<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMR Scanner</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1b1b1b;--mu:#6b6b6b;--ac:#c62828;--ok:#2e7d32;--bd:#e2dfd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#232323;--tx:#eee;--mu:#9a9a9a;--bd:#3a3a3a;--ac:#ef5350;--ok:#66bb6a;color-scheme:dark}}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}h1{font-size:21px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 10px}.s{color:var(--mu);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;min-height:44px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
button.p,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.key{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.kr{display:flex;align-items:center;gap:5px}.kr b{width:24px;text-align:right;font-size:12px;color:var(--mu)}
.kr button{padding:4px 0;width:40px;border-radius:50%;font-size:13px}.kr button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=text],input[type=number]{font:inherit;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=text]{min-width:0;flex:1}input[type=number]{width:110px}
input.bad{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:10px;background:#000;margin-top:8px}
.res{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}.res.err{border-color:var(--ac)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.score{font-size:24px;font-weight:700}
.st{font-size:13px;color:var(--mu)}.st b{color:var(--tx)}.res img{width:100%;border-radius:8px;margin-top:8px}
.answers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:8px;font-size:12px}
.answers span{padding:5px 3px;border-radius:6px;text-align:center;background:var(--bd)}
.answers .ok{background:#c8e6c9;color:#1b5e20}.answers .bad{background:#ffcdd2;color:#8e0000}.answers .dbl{background:#ffe0b2;color:#7a4100}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.warn{color:var(--ac);font-size:13px;margin:6px 0 0}
@media (max-width:600px){
 main{padding:12px 10px env(safe-area-inset-bottom,12px)}
 h1{font-size:20px}.card{padding:12px;border-radius:12px}
 #exam,#qcount{width:100%}
 .key{grid-template-columns:1fr;gap:6px}
 .kr{min-height:44px}.kr b{width:28px}.kr button{width:42px}
 .row>.btn,.row>button{width:100%;flex:1 1 100%}
 .top>.row{width:100%}.top>.score{margin-left:auto}
 .res .row[style]{margin-top:8px}
 .res .roll{flex:0 0 110px}.res .nm{min-width:0}
}
</style></head><body><main>
<h1>OMR Scanner</h1><p class="s">Set the answer key → scan a photo, PDF, or camera capture → export to Excel</p>

<section class="card"><h2>1. Exam setup</h2>
<input type="text" id="exam" placeholder="Exam name (used for the Excel filename)" autocomplete="off">
<label class="s" style="display:block;margin-top:10px" for="qcount">Number of questions (1-50)</label><input type="number" id="qcount" min="1" max="50" step="1" value="50">
<p class="s" style="margin-top:12px">Select the correct answer for each question</p><div class="key" id="key"></div></section>

<section class="card"><h2>2. Scan</h2>
<div class="row"><label class="btn p">📁 Photo / PDF (select multiple files)<input type="file" id="files" accept="image/*,application/pdf" multiple hidden></label>
<button id="bcam">📷 Live camera</button></div>
<div id="camwrap" hidden><video id="vid" playsinline muted></video><div class="row" style="margin-top:8px"><button class="p" id="bsnap">Capture and scan</button><button id="bstop">Stop camera</button></div>
<p class="s">Keep the entire sheet in frame, use good lighting, and hold it straight.</p></div>
<div class="bar" id="bar" hidden><i id="barin"></i></div><p class="s" id="status"></p></section>

<section class="card" id="resc" hidden><h2>3. Results <span class="s" id="sum"></span></h2>
<div class="row"><button class="p" id="bexp">⬇ Export to Excel (.xlsx)</button><button id="bclr">Clear all results</button></div><div id="list"></div></section>

<script>
const L=['ক','খ','গ','ঘ'];let N=50,key=[],results=[],stream=null,cam=0,uid=0;
const $=i=>document.getElementById(i);
try{const s=JSON.parse(localStorage.getItem('omr')||'null');if(s){N=Number.isInteger(s.N)&&s.N>=1&&s.N<=50?s.N:50;key=Array.isArray(s.key)?s.key:[];$('exam').value=s.exam||''}}catch(e){}
const save=()=>{try{localStorage.setItem('omr',JSON.stringify({N,key,exam:$('exam').value}))}catch(e){}};
$('exam').oninput=save;
function drawSetup(){$('qcount').value=N;
 const k=$('key');k.innerHTML='';for(let q=0;q<N;q++){const r=document.createElement('div');r.className='kr';r.innerHTML='<b>'+(q+1)+'</b>';
  L.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;const selected=(Array.isArray(key[q])?key[q]:[key[q]]).filter(Number.isInteger);if(selected.includes(i))b.className='on';b.onclick=()=>{let next=(Array.isArray(key[q])?key[q]:[key[q]]).filter(Number.isInteger);if(next.includes(i))next=next.filter(x=>x!==i);else next.push(i);key[q]=next.sort();save();drawSetup();renderList()};r.append(b)});k.append(r)}}
function setQuestionCount(){const n=Number($('qcount').value);if(!Number.isInteger(n)||n<1||n>50){$('qcount').value=N;alert('Enter a whole number between 1 and 50.');return}if(n!==N){N=n;save();drawSetup();renderList()}}
$('qcount').onchange=setQuestionCount;
const keyOK=()=>{for(let q=0;q<N;q++){const a=(Array.isArray(key[q])?key[q]:[key[q]]).filter(Number.isInteger);if(!a.length||a.some(x=>x<0||x>3))return false}return true};
function score(r){let c=0,w=0,b=0,d=0;const st=[];for(let q=0;q<N;q++){const marked=Array.isArray(r.selected?.[q])?r.selected[q]:[];const expected=Array.isArray(key[q])?key[q]:[key[q]];if(!marked.length){b++;w++;st.push('w')}else if(marked.length>1){d++;w++;st.push('d')}else if(expected.includes(marked[0])){c++;st.push('c')}else{w++;st.push('w')}}Object.assign(r,{correct:c,wrong:w,blank:b,double:d,status:st})}

async function scanFile(file){const fd=new FormData();fd.append('file',file,file.name);fd.append('n',N);fd.append('key',JSON.stringify(key.slice(0,N)));
 try{const r=await fetch('/api/scan',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw new Error(j.error||'Server error');return j.results}
 catch(e){return[{file:file.name,error:e.message||'A network error occurred.'}]}}
async function run(files){if(!keyOK()){alert('First, set all '+N+' answers in Step 1.');return}
 $('bar').hidden=false;let i=0;for(const f of files){$('status').textContent='Scanning '+(i+1)+' / '+files.length+' : '+f.name;$('barin').style.width=(100*i/files.length)+'%';
  const rs=await scanFile(f);rs.forEach(r=>{r.id=++uid;if(!r.error){score(r)}results.push(r)});renderList();i++}
 $('barin').style.width='100%';$('status').textContent=files.length+' file(s) scanned.';setTimeout(()=>$('bar').hidden=true,800)}
$('files').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await run(f)};

$('bcam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:2560},height:{ideal:1440}}});$('vid').srcObject=stream;$('camwrap').hidden=false;await $('vid').play()}catch(e){alert('Unable to start the camera. Check browser permissions, or upload a photo using the "Photo / PDF" button.')}};
const stopCam=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('camwrap').hidden=true};$('bstop').onclick=stopCam;
$('bsnap').onclick=()=>{const v=$('vid'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
 c.toBlob(b=>run([new File([b],'camera-'+(++cam)+'.jpg',{type:'image/jpeg'})]),'image/jpeg',.92)};

function renderList(){const el=$('list');el.innerHTML='';$('resc').hidden=!results.length;
 let tot=0,cnt=0;
 results.forEach(r=>{const d=document.createElement('div');d.className='res'+(r.error?' err':'');
  if(r.error){d.innerHTML='<div class="top"><b></b><button>✕</button></div><p class="warn"></p>';d.querySelector('b').textContent=r.file;d.querySelector('p').textContent='⚠ '+r.error;d.querySelector('button').onclick=()=>{results=results.filter(x=>x!==r);renderList()};el.append(d);return}
  score(r);tot+=r.correct;cnt++;
  d.innerHTML='<div class="top"><div class="row" style="flex:1"><input type="text" class="roll" placeholder="Roll number" style="max-width:110px"><input type="text" class="nm" placeholder="Student name"></div><div class="score"></div></div><div class="st"></div><div class="answers"></div><div class="row" style="margin-top:8px"><button class="tg">View overlay</button><button class="rm">Remove</button></div><p class="warn" hidden></p>';
  const roll=d.querySelector('.roll'),nm=d.querySelector('.nm');roll.value=r.roll||'';nm.value=r.name||'';
  const chk=()=>roll.classList.toggle('bad',/[?*]/.test(roll.value));chk();
  roll.oninput=()=>{r.roll=roll.value;chk()};nm.oninput=()=>{r.name=nm.value};
  d.querySelector('.score').textContent=r.correct+' / '+N;
  d.querySelector('.st').innerHTML='<b>'+r.file.replace(/[<>&]/g,'')+'</b> · Correct <b>'+r.correct+'</b> · Wrong <b>'+r.wrong+'</b> · Blank <b>'+r.blank+'</b> · Double <b>'+r.double+'</b>';
  const detail=d.querySelector('.answers');
  for(let q=0;q<N;q++){const marked=Array.isArray(r.selected?.[q])?r.selected[q]:[];const expected=(Array.isArray(key[q])?key[q]:[key[q]]).filter(Number.isInteger);const label=marked.length?marked.map(i=>L[i]).join('+'):'Blank';const expectedLabel=expected.map(i=>L[i]).join('/')||'-';const cls=!marked?'bad':marked.length>1?'dbl':expected.includes(marked[0])?'ok':'bad';const s=document.createElement('span');s.className=cls;s.textContent=(q+1)+': '+label+' (key '+expectedLabel+')';detail.append(s)}
  if(/[?*]/.test(r.roll||''))Object.assign(d.querySelector('.warn'),{hidden:false,textContent:'The roll number could not be read completely (? = no bubble, * = multiple bubbles). Correct it manually.'});
  let img=null;d.querySelector('.tg').onclick=()=>{if(img){img.remove();img=null;return}img=new Image();img.src=r.overlay;d.append(img)};
  d.querySelector('.rm').onclick=()=>{results=results.filter(x=>x!==r);renderList()};el.append(d)});
 $('sum').textContent=cnt?'· '+cnt+' sheet(s) · average '+(tot/cnt).toFixed(1)+' / '+N:''}

$('bclr').onclick=()=>{if(confirm('Clear all results?')){results=[];renderList()}};
$('bexp').onclick=async()=>{const rows=results.filter(r=>!r.error).map(r=>({roll:r.roll||'',name:r.name||'',correct:r.correct,wrong:r.wrong,blank:r.blank,double:r.double,answers:r.answers,status:r.status}));
 if(!rows.length)return;const res=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({exam:$('exam').value,n:N,key:key.slice(0,N),rows})});
 if(!res.ok){alert('Export failed.');return}const a=document.createElement('a');a.href=URL.createObjectURL(await res.blob());a.download=($('exam').value.trim()||'omr-results')+'.xlsx';a.click()};
drawSetup();
</script></main></body></html>
